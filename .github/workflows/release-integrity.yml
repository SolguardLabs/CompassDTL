name: release-integrity

on:
  push:
    branches: [main, production]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify immutable production reference
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          main_sha="$(git rev-parse origin/main)"
          if [[ "$EVENT_NAME" == "release" ]]; then
            test -n "$RELEASE_TAG"
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force
            test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
            test "$(git rev-parse "$RELEASE_TAG^{}")" = "$main_sha"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            test "$(git cat-file -t "$REF_NAME")" = "tag"
            test "$(git rev-parse "$REF_NAME^{}")" = "$main_sha"
          elif [[ "$REF_NAME" == "production" ]]; then
            test "$(git rev-parse HEAD)" = "$main_sha"
          fi
